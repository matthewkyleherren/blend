<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Page - CMS Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <div class="header">
    <div class="header-content">
      <h1 id="pageTitle">Edit Page</h1>
      <div>
        <button class="btn btn-secondary btn-small" onclick="window.location.href='/admin/dashboard.html'">
          ← Back to Dashboard
        </button>
        <button class="btn btn-secondary btn-small" id="logoutBtn">Logout</button>
      </div>
    </div>
  </div>

  <div class="action-bar">
    <button class="btn btn-success" id="saveBtn" disabled>
      Save Changes
    </button>
    <button class="btn btn-secondary" id="previewBtn" disabled>
      Preview JSON
    </button>
    <button class="btn btn-danger" id="resetBtn" disabled>
      Reset Changes
    </button>
    <div style="margin-left: auto; color: var(--text-secondary); font-size: 0.875rem;" id="statusText">
      Loading...
    </div>
  </div>

  <div class="container">
    <div id="alertContainer"></div>

    <div id="editorContainer">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading page content...</p>
      </div>
    </div>
  </div>

  <!-- Image Modal -->
  <div id="imageModal" class="hidden" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div style="background: white; border-radius: 12px; max-width: 800px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 2rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2>Select Image</h2>
        <button class="btn btn-secondary btn-small" onclick="closeImageModal()">Close</button>
      </div>

      <div class="form-group">
        <label class="form-label">Upload New Image</label>
        <input type="file" id="imageUploadInput" accept="image/*,video/*" class="form-input">
        <button class="btn btn-primary btn-small mt-1" id="uploadImageBtn">Upload</button>
      </div>

      <div style="margin-top: 1.5rem;">
        <label class="form-label">Or select from existing images</label>
        <div id="imageGridContainer">
          <div class="loading">
            <div class="spinner"></div>
            <p>Loading images...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/admin/js/editor.js"></script>
</body>
</html>
